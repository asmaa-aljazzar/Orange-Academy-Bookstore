<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Text Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="editor-container">
    <h1>Interactive Text Editor</h1>

    <!-- Display Area -->
    <div id="text-display" class="text-display">HELLO</div>

    <!-- Controls Container -->
    <div class="controls-panel">
      
      <!-- Formatting & Alignment Buttons -->
      <div class="button-row">
        <button id="btn-bold" class="btn btn-bold">Bold</button>
        <button id="btn-italic" class="btn btn-italic">Italic</button>
        <button id="btn-left" class="btn">Left</button>
        <button id="btn-center" class="btn">Center</button>
        <button id="btn-right" class="btn">Right</button>
      </div>

      <!-- Text Case & Clear Buttons -->
      <div class="button-row">
        <button id="btn-uppercase" class="btn">Upper Case</button>
        <button id="btn-lowercase" class="btn">Lower Case</button>
        <button id="btn-capitalize" class="btn">Capitalize</button>
        <button id="btn-clear" class="btn">Clear Text</button>
      </div>

      <!-- Color Pickers -->
      <div class="control-row">
        <label for="text-color">Text Color:</label>
        <input type="color" id="text-color" value="#8B0000">

        <label for="bg-color">Background:</label>
        <input type="color" id="bg-color" value="#00FFFF">
      </div>

      <!-- Font Options -->
      <div class="control-row">
        <label for="font-size">Font Size:</label>
        <input type="number" id="font-size" value="47" min="10" max="100">

        <label for="font-family">Font:</label>
        <select id="font-family">
          <option value="Georgia" selected>Georgia</option>
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Verdana">Verdana</option>
        </select>
      </div>

    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
