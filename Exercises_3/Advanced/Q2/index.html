<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Score</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="container">
        <!-- Main Header -->
        <h1 id="main-heading">Use a Test Score array</h1>

        <!-- Input Form Section -->
        <div id="form-container">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="ex. john_doe">
            </div>

            <div class="form-group">
                <label for="score">Score:</label>
                <input type="text" id="score" placeholder="ex. 95">
            </div>

            <div id="button-group">
                <button type="button" id="add-btn">Add to Array</button>
                <button type="button" id="display-results-btn">Display Results</button>
                <button type="button" id="display-scores-btn">Display Scores</button>
            </div>
        </div>
        <div id="separator"></div>
        </section>
    </main>

    <table>
        <thead>
            <th></th>
            <th></th>
        </thead>
    </table>
    <script src="app.js"></script>
</body>
</html>
